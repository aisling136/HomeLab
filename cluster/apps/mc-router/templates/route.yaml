apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/target: external.aisling.dev
  name: mc-router
  namespace: {{ .Release.Namespace }}
spec:
  hostnames:
    - cherry.aisling.dev
    - mc.aisling.dev
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-aisling-dev-external
      namespace: network
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: mc-router
          namespace: default
          port: 25565
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
