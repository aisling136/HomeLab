app-template:
  controllers:
    unpackerr:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app: &app unpackerr
      containers:
        unpackerr:
          image:
            repository: ghcr.io/unpackerr/unpackerr
            tag: v1.0.0@sha256:21c6bfa4f4c86ab2dd0232da0dfb3ed4c5d929e42e09894e7b4d2154d0c144f6
          env:
            TZ: America/New_York
            UN_WEBSERVER_METRICS: true
            UN_WEBSERVER_LOG_FILE: /logs/webserver.log
            UN_ACTIVITY: true
            UN_SONARR_0_URL: http://sonarr.media.svc.cluster.local
            UN_SONARR_0_PATHS_0: /complete
            UN_RADARR_0_URL: http://radarr.media.svc.cluster.local
            UN_RADARR_0_PATHS_0: /complete
            UN_WEBSERVER_ROLES_metrics_PERMISSIONS_0: system:metrics:read
            UN_WEBSERVER_API_KEYS_0_NAME: prometheus
            UN_WEBSERVER_API_KEYS_0_ROLES_0: metrics
          envFrom:
            - secretRef:
                name: unpackerr-secret
            - secretRef:
                  name: unpackerr-metrics-secret
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 4Gi
      pod:
        securityContext:
          runAsUser: 568
          runAsGroup: 568
          runAsNonRoot: true
          fsGroup: 568
          fsGroupChangePolicy: OnRootMismatch
          supplementalGroups: [10000]
  service:
    unpackerr:
      controller: unpackerr
      labels:
        app: *app
      ports:
        http:
          port: 5656
  serviceMonitor:
    app:
      serviceName: unpackerr
      endpoints:
        - port: http
          scheme: http
          path: /metrics
          interval: 1m
          scrapeTimeout: 10s
          authorization:
            credentials:
              name: unpackerr-metrics-secret
              key: UN_WEBSERVER_API_KEYS_0_KEY
  persistence:
    logs:
      type: emptyDir
    complete:
      type: nfs
      path: /mnt/pool0/media
      server: crypt
      globalMounts:
        - path: /media
